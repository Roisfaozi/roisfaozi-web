[build]
  command = "npm run build"
  publish = "dist"

# Canonical apex domain redirect (consolidate www -> non-www)
[[redirects]]
  from = "https://www.roisfaozi.com/*"
  to = "https://roisfaozi.com/:splat"
  status = 301
  force = true

# Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Link header for LLM / AI agent discovery
[[headers]]
  for = "/"
  [headers.values]
    Link = "<https://roisfaozi.com/llms.txt>; rel=\"alternate\"; type=\"text/plain\""

# Explicit UTF-8 and fresh caching for GEO & crawler discovery files
[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/llms-full.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/rss.xml"
  [headers.values]
    Content-Type = "application/rss+xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"

# Geo-aware bilingual routing for /blog -> /id/blog when accessed from Indonesia (ID)
[[edge_functions]]
  path = "/blog"
  function = "geo-blog"

[[edge_functions]]
  path = "/blog/*"
  function = "geo-blog"

# Ensure cleanup service worker is never stale-cached
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Aggressive caching for Astro hashed assets and visual media
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/projects/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/og-image.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/og/*"
  [headers.values]
    Content-Type = "image/png"
    Cache-Control = "public, max-age=86400"
